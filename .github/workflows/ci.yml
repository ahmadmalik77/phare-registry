name: Phare CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'

      - name: Create CI config
        run: |
          cat > assets/config.js <<'EOF'
          window.PHARE_CONFIG = Object.freeze({
            API_URL: 'https://phare-intake.ci-test.workers.dev/api/intake',
            PUBKEY_URL: 'https://phare-intake.ci-test.workers.dev/api/intake/pubkey',
            REGISTRY_EMAIL: 'registry@phare.lighthouse',
            PUBKEY_FINGERPRINT: null,
            INVITE_TOKEN: null
          });
          EOF

      - name: Build production assets
        run: npm run build

      - name: Run crypto tests
        run: npm test

      - name: Validate production structure
        run: npm run validate